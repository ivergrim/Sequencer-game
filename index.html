<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f7" />
    <!-- Three steps of a lane, one of them silent. Inline, so the tab icon costs no
         request and the game keeps its no-asset-pipeline rule. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f7f7f7'/%3E%3Crect x='1' y='3' width='3' height='10' fill='%23535353'/%3E%3Crect x='6' y='3' width='3' height='10' fill='%23bdbdbd'/%3E%3Crect x='11' y='3' width='3' height='10' fill='%23535353'/%3E%3C/svg%3E"
    />
    <title>Sequencing runner — chapter 1</title>
    <meta
      name="description"
      content="A rhythm puzzle runner. Program the drum pattern, the pattern drives the character."
    />
  </head>
  <body>
    <main id="app">
      <!-- Run is the one thing a player has to find, so it sits above the stage as a
           banner rather than in the row of controls under it. It is a real button, and
           the keys that do the same thing are printed on it rather than listed
           separately. While a run is in flight it goes inert and reports the phase, which
           keeps the layout from shifting under the canvas every time a run starts. -->
      <button id="run" type="button" aria-keyshortcuts="Space R">
        <span class="mark" aria-hidden="true"></span>
        <span class="label">run</span>
        <span class="keys"><kbd>space</kbd><kbd>R</kbd></span>
      </button>
      <canvas id="stage"></canvas>
      <div id="sequencer"></div>
      <div id="controls">
        <button id="clear" type="button" aria-keyshortcuts="Escape">
          <span class="label">clear</span>
          <span class="keys"><kbd>esc</kbd></span>
        </button>
        <button id="restart" type="button"><span class="label">restart chapter</span></button>
      </div>
    </main>

    <div id="start" role="button" tabindex="0">
      <div class="start-inner">
        <h1>Sequencing runner</h1>
        <p class="start-sub">Chapter 1 &middot; deep house &middot; 124 BPM</p>
        <p class="start-go">Click or press space to start</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
